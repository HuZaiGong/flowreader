# Project-wide Gradle settings.

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# 1. 开启守护进程（避免每次启动 JVM 开销）
org.gradle.daemon=true

# 2. 并行执行任务（多模块项目必备）
org.gradle.parallel=true

# 3. 按需配置（只配置当前任务涉及的项目，大幅减少配置阶段时间）
org.gradle.configureondemand=true

# 4. 最大并行 Worker 数（CPU 核心数留 2 给系统）
org.gradle.workers.max=6

# 5. 增加堆内存（根据机器配置调整，避免频繁 GC）
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8

# 6. 开启构建缓存（复用之前构建的输出）
org.gradle.caching=true

# 7. 文件系统监控（加速增量构建，Gradle 8.7+）
org.gradle.vfs.watch=true

# 8. Kotlin 编译器守护进程 JVM 参数
kotlin.daemon.jvmargs=-Xmx2048m -XX:+UseParallelGC

# 9. Kotlin 增量编译和并行编译
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true