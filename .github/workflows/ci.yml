name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Kotlin style
        run: ./gradlew verifyKotlinStyle

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Check coverage target
        run: ./gradlew coverageSummary

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Screenshot regression check
        run: ./gradlew verifyRoborazziDebug

      - name: Performance baseline (APK sizes)
        run: ./gradlew performanceBaseline

      - name: Summarize performance
        shell: bash
        run: |
          SIZE_KB=$(find app/build/outputs/apk/release -name '*.apk' -printf '%s' | head -1)
          echo "## Performance baseline" >> "$GITHUB_STEP_SUMMARY"
          echo "Release APK size: $((SIZE_KB / 1024))KB" >> "$GITHUB_STEP_SUMMARY"
