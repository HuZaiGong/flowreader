// Compose compiler stability configuration.
//
// :domain deliberately has no Compose compiler plugin (the module must stay free of
// app/Room/Compose/Hilt), so the compiler cannot see its classes and infers every one of them as
// unstable. That makes `unstable book: Book` a parameter no skip check can ever pass: every
// LibraryUiState change re-executed every visible BookGridCard / BookListItem, and every reader
// state change re-executed the annotation-bearing paragraphs.
//
// Listing them here restores skippability without adding a Compose dependency to :domain. The
// promise being made is that these types are never mutated in place after construction. That holds
// today: every domain model is a `data class` of vals, all collection fields are the read-only
// List/Set interfaces, and nothing calls a Date setter anywhere in the repo (Date is only read via
// Calendar). Adding a `var`, an exposed MutableList, or in-place Date mutation to any type below
// silently breaks recomposition correctness — stale UI, no crash. Keep that in mind before editing
// a domain model.

// Domain models — plain immutable data carriers.
com.flowreader.app.domain.model.*

// java.util.Date is treated as immutable by convention here: it is only ever constructed and read.
java.util.Date

// Read-only collection interfaces. The concrete instances handed to Compose come from Room queries,
// listOf/emptyList, or map/filter results — never a mutable list that is later written to.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
